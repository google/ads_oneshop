syntax = "proto3";

package acit.api.v0.storage;

import "bq_table.proto";
import "google/shopping/merchant_products_v1/types/products.proto";
import "google/shopping/merchant_products_v1/types/products_common.proto";
import "google/shopping/merchant_promotions_v1/types/promotions.proto";
import "google/shopping/merchant_accounts_v1/types/accountrelationships.proto";
import "google/shopping/merchant_accounts_v1/types/accountservices.proto";
import "google/shopping/merchant_accounts_v1/types/automaticimprovements.proto";
import "google/shopping/merchant_accounts_v1/types/businessidentity.proto";
import "google/shopping/merchant_accounts_v1/types/businessinfo.proto";
import "google/shopping/merchant_accounts_v1/types/homepage.proto";
import "google/shopping/merchant_accounts_v1/types/omnichannelsettings.proto";
import "google/shopping/merchant_accounts_v1/types/online_return_policy.proto";
import "google/shopping/merchant_accounts_v1/types/programs.proto";
import "google/shopping/merchant_accounts_v1/types/shippingsettings.proto";
import "google/shopping/merchant_accounts_v1/types/user.proto";
import "google/type/datetime.proto";

message WideProduct {
  option (gen_bq_schema.bigquery_opts).table_name = "Products";
  optional google.shopping.merchant.products.v1.Product product = 1;
  optional google.shopping.merchant.products.v1.ProductStatus status = 2;
  optional bool has_performance_max_targeting = 3;
  repeated int64 performance_max_campaign_ids = 4;
  optional bool has_shopping_targeting = 5;
  repeated int64 shopping_campaign_ids = 6;
  optional bool in_stock = 7;
  repeated string approved_countries = 8;
  repeated string pending_countries = 9;
  repeated string disapproved_countries = 10;
  optional string offer_id = 11;
  optional string account_id = 12;
  optional string channel = 13;
}

// Content API `liasettings` -> Merchant API v1 `OmnichannelSettings` migration:
// v1 has no `liasettings` resource, no MCA roll-down `list`, and the aggregator
// itself is not a valid parent (PermissionDenied), so settings are listed per
// (sub)account directly. We therefore drop the old {settings, children[]} envelope
// and write one FLAT row per account, each with a repeated list of per-region
// OmnichannelSetting. The MCA<->child relationship is recovered downstream from
// the (already migrated) `accounts` table.
message OmnichannelLiaSettings {
  option (gen_bq_schema.bigquery_opts).table_name = "liasettings";

  optional int64 account_id = 1;

  repeated google.shopping.merchant.accounts.v1.OmnichannelSetting omnichannel_settings = 2;
}

// Content API `shippingsettings` -> Merchant API v1 migration:
// v1 `ShippingSettings` is a singleton per account, identified only by its
// resource name (`accounts/{id}/shippingSettings`). The resource name carries no
// analytical value, so it is dropped and an explicit `account_id` added --
// matching the `liasettings` table and keeping the MEX joins on `account_id`
// working unchanged.
//
// `services` and `warehouses` are the API messages verbatim. The MEX views
// reach deep into `services` (`delivery_time.*`, and
// `rate_groups.main_table.rows.cells.flat_rate.amount_micros`), which is exactly
// why this shape should come from the API proto rather than be maintained by
// hand.
message ShippingSettings {
  option (gen_bq_schema.bigquery_opts).table_name = "shippingsettings";

  optional int64 account_id = 1;
  repeated google.shopping.merchant.accounts.v1.Service services = 2;
  repeated google.shopping.merchant.accounts.v1.Warehouse warehouses = 3;
  optional string etag = 4;
}

// One row of the `account_services` repeated field.
//
// v1 `AccountService` carries the kind of service in a `service_type` oneof
// whose members are all EMPTY messages, so the only information they hold is
// which member is set. Embedding it verbatim would give BigQuery six
// always-empty STRUCT columns, so the oneof is flattened to a single
// `service_type` STRING holding the set member's name (upper-cased). Every
// other field mirrors the API message.
message AccountServiceRow {
  optional string name = 1;
  optional string provider = 2;
  optional string provider_display_name = 3;
  optional string external_account_id = 4;
  optional google.shopping.merchant.accounts.v1.AccountService.Mutability mutability = 5;
  optional string service_type = 6;
  optional google.shopping.merchant.accounts.v1.Handshake handshake = 7;
}

// Content API `accounts` -> Merchant API v1 migration:
// the old monolithic `Account` is split across many v1 sub-resources, so an
// account is re-assembled into one flat row here. The core `Account` scalars
// are inlined (rather than embedding the whole message) because the v1
// `Account.name` / resource-name plumbing carries no analytical value.
//
// `account_id` and `parent_account` are int64 to match the columns the
// downstream views already expect -- `ml_data.sql` does
// `CAST(account_id AS STRING)` and `account_list.sql` self-joins
// `parent_account = account_id`.
message Account {
  option (gen_bq_schema.bigquery_opts).table_name = "accounts";

  optional int64 account_id = 1;
  optional string account_name = 2;
  optional bool adult_content = 3;
  optional bool test_account = 4;
  optional google.type.TimeZone time_zone = 5;
  optional string language_code = 6;
  // Whether this is an advanced (multi-client) account. Derived from whether
  // the account reported any sub-accounts, not an API field.
  optional bool is_advanced = 7;
  // The aggregator this account sits under; unset for standalone accounts and
  // for aggregators themselves.
  optional int64 parent_account = 8;

  optional google.shopping.merchant.accounts.v1.Homepage homepage = 9;
  optional google.shopping.merchant.accounts.v1.BusinessInfo business_info = 10;
  optional google.shopping.merchant.accounts.v1.BusinessIdentity business_identity = 11;
  optional google.shopping.merchant.accounts.v1.AutomaticImprovements automatic_improvements = 12;

  repeated google.shopping.merchant.accounts.v1.User users = 13;
  repeated google.shopping.merchant.accounts.v1.AccountRelationship account_relationships = 14;
  repeated AccountServiceRow account_services = 15;
  repeated google.shopping.merchant.accounts.v1.Program programs = 16;
}

// === Programs Settings ===
message ProgramsSettings {
  option (gen_bq_schema.bigquery_opts).table_name = "programs";
  optional int64 account_id = 1;
  repeated google.shopping.merchant.accounts.v1.Program programs = 2;
}

// === Return Policies ===
message ReturnPolicies {
  option (gen_bq_schema.bigquery_opts).table_name = "returns";
  optional int64 account_id = 1;
  repeated google.shopping.merchant.accounts.v1.OnlineReturnPolicy returns = 2;
}

// === Promotions ===
message Promotions {
  option (gen_bq_schema.bigquery_opts).table_name = "promotions";
  optional int64 account_id = 1;
  repeated google.shopping.merchant.promotions.v1.Promotion promotions = 2;
}

// === Reports Settings ===
message ReportsSettings {
  option (gen_bq_schema.bigquery_opts).table_name = "reports";
  optional int64 account_id = 1;
  optional bool has_market_insights = 2;
  repeated ReportRowDiagnostics structured_data_issues = 3;
}

message ReportRowDiagnostics {
  optional string id = 1;
  optional string offer_id = 2;
  repeated ProductViewItemIssue item_issues = 3;
}

message ProductViewItemIssue {
  optional ProductViewItemIssueType type_ = 1 [json_name = "type_"];
  optional ProductViewItemIssueSeverity severity = 2;
  optional string resolution = 3;
}

message ProductViewItemIssueType {
  optional string code = 1;
  optional string canonical_attribute = 2;
}

message ProductViewItemIssueSeverity {
  optional string aggregated_severity = 1;
  repeated ProductViewItemIssueSeverityContext severity_per_reporting_context = 2;
}

message ProductViewItemIssueSeverityContext {
  optional string reporting_context = 1;
  repeated string disapproved_countries = 2;
  repeated string demoted_countries = 3;
}
